        for (const o of [0, Math.PI]) ebullets.push({ x: b.x + p.ox, y: b.y + p.oy, vx: Math.cos(a + o) * 115, vy: Math.sin(a + o) * 115 });
      }); });
      return 2.6;
    }
    if (m === 1) {   // homing missiles from the wingtips
      for (const s of [-1, 1]) for (let k = 0; k < 2; k++) later(b, k * 0.3, () => ebullets.push({ x: b.x + s * 76, y: b.y + 8, vx: s * 60, vy: 80, r: 3.5, home: 1.6 }));
      return 2.0;
    }
    if (m === 2 && bay) {   // the hangar launches fighters
      for (let i = 0; i < 3; i++) later(b, i * 0.3, () => { if (!bay.dead) spawnMinion(pick(['inter', 'raider']), b.x, b.y - 4); });
      return 2.0;
    }
    ring(b.x, b.y + 22, angry ? 22 : 18, 110, Math.random() * TAU);
    if (exposed(b)) later(b, 0.5, () => ring(b.x, b.y + 22, 18, 140, Math.random() * TAU));
    return 2.0;
  },
  mantis(b, m, angry) {
    m %= 3;
    if (m === 0) { b.tractor = { stage: 'warn', t: 0 }; sfx.charge(); return 4.2; }
    if (m === 1) { for (const s of [-1, 1]) fan(b.x + s * 28, b.y + 30, angry ? 5 : 4, aimAt(b.x + s * 28, b.y + 30), 0.7, D.bulletSpd + 20); return 1.8; }
    for (let i = 0; i < (angry ? 3 : 2); i++) later(b, i * 0.35, () => spawnMinion('bird', b.x, b.y + 20));
    for (let k = 0; k < 4; k++) later(b, 0.5 + k * 0.12, () => enemyShoot(b.x, b.y + 36, true, D.bulletSpd + 40));
    return 2.0;
  },
  brood(b, m, angry) {
    m %= 3;
    if (m === 0) { const left = Math.random() < 0.5; launchStream(b, left); if (angry) later(b, 0.7, () => launchStream(b, !left)); return 3.2; }
    if (m === 1) { ring(b.x, b.y + 10, angry ? 16 : 12, 120, Math.random() * TAU); later(b, 0.4, () => fan(b.x, b.y + 30, 5, aimAt(b.x, b.y + 30), 0.8, D.bulletSpd)); return 1.9; }
    for (let i = 0; i < 4; i++) later(b, i * 0.2, () => {   // spore pods that burst
      const a = aimAt(b.x, b.y + 20) + rand(-0.6, 0.6);
      ebullets.push({ x: b.x, y: b.y + 20, vx: Math.cos(a) * 110, vy: Math.sin(a) * 110, r: 4.5, burst: rand(0.7, 1.1), n: 6 });
    });
    return 2.3;
  },
  well(b, m, angry) {
    m %= 3;
    if (m === 0) { openHole(); if (angry) openHole(); sfx.charge(); return 3.4; }
    if (m === 1) { ring(b.x, b.y, angry ? 20 : 16, 115, Math.random() * TAU); return 1.7; }
    for (let k = 0; k < 6; k++) later(b, k * 0.1, () => enemyShoot(b.x, b.y + 30, true, D.bulletSpd + 30));
    return 1.8;
  },
  twins(b, m) {
    m %= 3;
    const live = b.parts.filter(p => !p.dead);
    if (m === 0) {
      live.forEach((p, i) => { for (let k = 0; k < 3; k++) later(b, i * 0.2 + k * 0.12, () => { if (!p.dead) enemyShoot(b.x + p.ox, b.y + p.oy, true, D.bulletSpd + 30); }); });
      return 1.8;
    }
    if (m === 1 && live.length === 2) { b.lash = 1.6; sfx.charge(); return 2.4; }   // the tether swings wide
    live.forEach(p => fan(b.x + p.ox, b.y + p.oy + 10, 5, Math.PI / 2, 1.0, D.bulletSpd));
    return 1.7;
  },
  warden(b, m, angry) {
    m %= 3;
    const sats = b.parts.filter(p => !p.dead);
    if (m === 0 && sats.length) {   // satellites fire outward: a rotating ring
      for (let r = 0; r < 3; r++) later(b, r * 0.28, () => {
        for (const p of sats) if (!p.dead) { const a = Math.atan2(p.oy, p.ox); ebullets.push({ x: b.x + p.ox, y: b.y + p.oy, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120 }); }
      });
      return 2.2;
    }
    if (m === 1) { beam(b, 0, 0, aimAt(b.x, b.y), { warn: 0.9, life: 0.7, w: 14, col: '#4ab8ff' }); sfx.charge(); later(b, 0.9, sfx.beam); return 2.4; }
    fan(b.x, b.y + 26, angry ? 9 : 7, aimAt(b.x, b.y + 26), 1.0, D.bulletSpd + 10);
    return 1.7;
  },
  serpent(b, m) {
    m %= 3;
    const segs = b.parts.filter(p => !p.dead);
    if (m === 0 && segs.length) { segs.forEach((p, i) => later(b, i * 0.07, () => { if (!p.dead) enemyShoot(b.x + p.ox, b.y + p.oy, true, D.bulletSpd * 0.9); })); return 2.0; }
    if (m === 1) { fan(b.x, b.y + 16, 5, aimAt(b.x, b.y + 16), 0.8, D.bulletSpd + 30); return 1.4; }
    b.dash = 1.6;
    if (!segs.length) ring(b.x, b.y, 14, 125, Math.random() * TAU);
    return 2.0;
  },
};

function updateBoss(dt) {
  const b = boss;
  b.flash = Math.max(0, b.flash - dt); b.inv = Math.max(0, b.inv - dt); b.charge = Math.max(0, b.charge - dt);
  for (const q of b.queue) q.t -= dt;
  const due = b.queue.filter(q => q.t <= 0); b.queue = b.queue.filter(q => q.t > 0);
  for (const q of due) if (boss === b) q.f();
  if (boss !== b) return;
  if (!b.entered) { b.y += 55 * dt; if (b.y >= b.ty) { b.y = b.ty; b.entered = true; } return; }
  if (b.parts) for (const p of b.parts) p.flash = Math.max(0, p.flash - dt);
  const angry = b.hp < b.max * 0.5 || isOpen(b);
  if (b.hold > 0) b.hold -= dt; else BOSS_MOVE[b.kind](b, dt, angry);
  if (player.alive && !b.ram) {
    b.atkT -= dt;
    if (b.atkT <= 0) {
      b.phase++;
      const pace = (angry ? 0.72 : 1) * Math.max(0.55, 1 - b.loop * 0.15 - wave * 0.004);
      b.atkT = BOSS_ATTACK[b.kind](b, b.phase, angry) * pace;
    }
  }
  if (player.alive && player.inv <= 0 && bossHit(b, player.x, player.y)) hitPlayer(2);
}

function hurtPart(b, p, amt) {
  p.hp -= amt; p.flash = 0.08;
  if (p.hp <= 0) {
    p.dead = true;
    const x = b.x + p.ox, y = b.y + p.oy;
    explode(x, y, ['#fff', '#ffd27a', '#ff7a3a', '#9aa0a6'], 40, 180);
    sfx.boom(); shake(0.4, 6); addScore(500 + wave * 20, x, y); dropGems(x, y, 6);
    if (exposed(b) && b.core > 0) { popup(b.x, b.y + 50, 'CORE EXPOSED!', '#ffd27a'); sfx.alarm(); }
  }
}

function damageBoss(amt, x, y, all) {
  const b = boss;
  if (!b) return;
  b.flash = 0.06;
  if (b.parts) {
    if (all) { for (const p of b.parts) if (!p.dead) hurtPart(b, p, p.max * 0.25); }
    else { const p = partAt(b, x, y); if (p) { hurtPart(b, p, amt); amt = 0; } }
    if (exposed(b)) b.core -= amt;
    b.hp = b.core + b.parts.reduce((s, p) => s + (p.dead ? 0 : p.hp), 0);
  } else b.hp -= amt;
  if (b.kind === 'cube') {
    b.dmg += amt;
    if (b.dmg >= 45 + b.loop * 15 && b.hp > 0) { b.dmg = 0; b.inv = 2.2; popup(b.x, b.y + 50, 'ADAPTING...', '#5dff7a'); sfx.adapt(); }
  }
  if (b.hp <= 0) {
    addScore(2000 + wave * 150, b.x, b.y);
    explode(b.x, b.y, ['#fff', '#ffd27a', '#ff7a3a', '#c8ccd2', '#ff4a3a'], 140, 300);
    for (let i = 0; i < 6; i++) explode(b.x + rand(-45, 45), b.y + rand(-45, 45), ['#fff', '#ffb04a'], 20, 120);
    shake(1, 12); sfx.bigboom(); flashT = 0.25;
    const dy = clamp(b.y, 40, H * 0.4);
    dropPower(b.x - 24, dy, 'P');
    dropPower(b.x + 24, dy, Math.random() < 0.5 ? 'B' : 'S');
    dropGems(b.x, dy, 16, 2 + b.loop);
    if (!practice) unlocked = Math.max(unlocked, wave / 5 + 1);
    saveProgress();
    hazards = []; holes = []; trails = []; boss = null;
  }
}

// ============================================================
//  UPDATE
// ============================================================
function firePlayer() {
  const L = player.level, y = player.y - 22;
  const add = (dx, a) => bullets.push({ x: player.x + dx, y, vx: Math.sin(a) * 560, vy: -Math.cos(a) * 560, dmg: 1, lv: L });
  if (L === 1) { add(-5.5, 0); add(5.5, 0); }
  else if (L === 2) { add(-5.5, 0); add(5.5, 0); add(0, 0); }
  else if (L === 3) { add(-5.5, 0); add(5.5, 0); add(-8, -0.16); add(8, 0.16); }
  else { add(0, 0); add(-5.5, -0.05); add(5.5, 0.05); add(-8, -0.22); add(8, 0.22); }
  player.cool = (L >= 5 ? 0.14 : 0.2) * (1 - U('cannon') * 0.08);
  sfx.shoot();
}

function nearestTarget(x, y) {
  let best = null, bd = 1e9;
  const consider = (tx, ty, obj) => { const d = (tx - x) ** 2 + (ty - y) ** 2; if (d < bd) { bd = d; best = obj; } };
  for (const e of enemies) if (!e.dead && e.y > 0) consider(e.x, e.y, e);
  for (const o of outposts) for (const t of o.targets) if (!t.dead && o.y + t.oy > 0) { const p = { x: o.x + t.ox, y: o.y + t.oy }; consider(p.x, p.y, p); }
  if (boss && boss.entered && !(boss.kind === 'shadow' && boss.inv > 0)) {
    if (boss.parts && !exposed(boss)) { for (const p of boss.parts) if (!p.dead) consider(boss.x + p.ox, boss.y + p.oy, { x: boss.x + p.ox, y: boss.y + p.oy }); }
    else consider(boss.x, boss.y, boss);
  }
  return best;
}

// ---------- Asteroid outposts: ground targets that scroll past beneath you ----------
function spawnOutpost() {
  const r = rand(30, 44), x = rand(r + 8, W - r - 8);
  const verts = [];
  for (let i = 0; i < 11; i++) { const a = i * TAU / 11; verts.push([Math.cos(a) * r * rand(0.78, 1.08), Math.sin(a) * r * rand(0.7, 0.98)]); }
  const craters = [0, 1, 2].map(() => [rand(-r * 0.5, r * 0.5), rand(-r * 0.4, r * 0.4), rand(3, 7)]);
  const slots = [[-0.42, -0.25], [0.42, -0.15], [0, 0.32], [0.05, -0.42]].sort(() => Math.random() - 0.5);
  const nT = Math.min(3, 1 + Math.floor(wave / 5) + (Math.random() < 0.4 ? 1 : 0));
  const targets = [];
  for (let i = 0; i < nT; i++) targets.push({ kind: 'turret', ox: slots[i][0] * r, oy: slots[i][1] * r, hp: 3 + Math.floor(wave / 5), fireT: rand(1.5, 3), aim: Math.PI / 2, flash: 0, sec: sector.no });
  if (Math.random() < 0.35) targets.push({ kind: 'depot', ox: slots[nT][0] * r, oy: slots[nT][1] * r, hp: 4, flash: 0, sec: sector.no });
  sector.targets += targets.length;
  outposts.push({ x, y: -r - 12, r, verts, craters, targets });
}
function updateOutposts(dt) {
  if (outpostT !== null && nextWaveT === 0) {
    outpostT -= dt;
    if (outpostT <= 0) { spawnOutpost(); outpostT = rand(8, 13) * Math.max(0.6, 1 - wave * 0.015); }
  }
  for (const o of outposts) {
    o.y += 36 * dt;
    for (const t of o.targets) {
      t.flash = Math.max(0, t.flash - dt);
      if (t.dead || t.kind !== 'turret') continue;
      const tx = o.x + t.ox, ty = o.y + t.oy;
      t.aim = Math.atan2(player.y - ty, player.x - tx);
      t.fireT -= dt;
      if (t.fireT <= 0) {
        t.fireT = rand(2.2, 3.6) / (1 + wave * 0.04);
        if (wave >= 2 && player.alive && ty > 10 && ty < player.y - 70) enemyShoot(tx, ty, true, D.bulletSpd * 0.8);
      }
    }
  }
  outposts = outposts.filter(o => o.y - o.r < H + 10);
}
function hitTarget(o, t, dmg) {
  t.hp -= dmg; t.flash = 0.08;
  if (t.hp > 0) { sfx.hit(); return; }
  t.dead = true;
  const x = o.x + t.ox, y = o.y + t.oy;
  if (t.sec === sector.no) sector.destroyed++;
  explode(x, y, ['#fff', '#ffb04a', '#ff7a3a', '#8a7a6a'], 26, 140);
  sfx.boom(); addScore(120, x, y);
  if (t.kind === 'depot') dropPower(x, y); else dropGems(x, y, 2);
}

// ---------- Stranded pilots: hover over a drifting escape pod to tractor it in ----------
function updatePods(dt) {
  if (podT !== null && nextWaveT === 0) {
    podT -= dt;
    if (podT <= 0) { podT = null; pods.push({ x: rand(40, W - 40), y: -20, t: 0 }); sector.pods++; }
  }
  for (const p of pods) {
    p.y += 30 * dt;
    const near = player.alive && Math.hypot(p.x - player.x, p.y - player.y) < 30;
    p.t = near ? p.t + dt : Math.max(0, p.t - dt * 0.5);
    if (p.t >= 1) {
      p.dead = true; sector.rescued++; sfx.rescue();
      addScore(500, p.x, p.y); dropGems(p.x, p.y, 5, 3);
      popup(p.x, p.y - 16, 'PILOT RESCUED!', '#7dff8a');
    } else if (p.y > H + 16) { p.dead = true; popup(p.x, H - safe.b - 60, 'PILOT LOST', '#ff8a7a'); }
  }
  pods = pods.filter(p => !p.dead);
}

// ---------- End of a sector: three medals, each worth bonus stars ----------
function finishSector() {
  const s = sector, bonus = 20 + s.no * 10;
  const medals = [
    { name: 'DESTROY 80% OF OUTPOSTS', ok: !s.targets || s.destroyed / s.targets >= 0.8, info: s.destroyed + '/' + s.targets },
    { name: 'RESCUE EVERY PILOT', ok: s.rescued === s.pods, info: s.rescued + '/' + s.pods },
    { name: 'TAKE NO HULL DAMAGE', ok: s.damage === 0, info: s.damage ? s.damage + (s.damage > 1 ? ' hits' : ' hit') : 'flawless' },
  ];
  const won = medals.filter(m => m.ok).length;
  bank += won * bonus; runStars += won * bonus; medalsTotal += won;
  saveProgress();
  sectorCard = { no: s.no, medals, bonus, t: 0 };
  if (won) sfx.medal();
}

function update(dt) {
  T += dt;
  starBoost = lerp(starBoost, nextWaveT > 0 ? 6 : 1, Math.min(1, dt * 3));
  updateStars(dt);

  // --- player ---
  if (player.alive) {
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.a || keys.A) kx -= 1;
    if (keys.ArrowRight || keys.d || keys.D) kx += 1;
    if (keys.ArrowUp || keys.w || keys.W) ky -= 1;
    if (keys.ArrowDown || keys.s || keys.S) ky += 1;
    player.x = clamp(player.x + kx * 270 * dt, 20, W - 20);
    player.y = clamp(player.y + ky * 270 * dt, minPlayerY(), maxPlayerY());
    player.inv = Math.max(0, player.inv - dt);
    player.lance = Math.max(0, player.lance - dt);
    player.homing = Math.max(0, player.homing - dt);
    player.cool -= dt;
    if (player.cool <= 0) firePlayer();
    if (player.homing > 0) {
      player.mcool -= dt;
      if (player.mcool <= 0) {
        player.mcool = 0.45; sfx.missile();
        for (const s of [-1, 1]) bullets.push({ x: player.x + s * 12, y: player.y - 4, vx: s * 170, vy: -150, dmg: 2, missile: true, life: 2.6 });
      }
    }
    if (U('shield') >= 2 && !player.shield) {   // shield generator recharges
      player.shieldT -= dt;
      if (player.shieldT <= 0) { player.shield = true; popup(player.x, player.y - 30, 'SHIELD READY', '#5ad2ff'); }
    }
  } else if (lives > 0) {
    respawnT -= dt;
    if (respawnT <= 0) {
      Object.assign(player, { alive: true, x: W / 2, y: playerY(), inv: 2.5, hp: maxHull(), shield: player.shield || U('shield') >= 1, shieldT: 25 });
      drag = null;
    }
  } else {
    gameOverDelay -= dt;
    if (gameOverDelay <= 0) {
      state = 'over'; overT = 0; saveProgress(); if (!practice) clearRun();
      if (score > hi) { hi = score; newHi = true; store('ns_hi', String(hi)); }
    }
  }

  for (const b of bullets) {
    if (b.missile) {
      b.life -= dt; if (b.life <= 0) b.dead = true;
      const t = nearestTarget(b.x, b.y);
      const sp = Math.min(440, Math.hypot(b.vx, b.vy) + 500 * dt);
      let a = Math.atan2(b.vy, b.vx);
      if (t) a = angLerp(a, Math.atan2(t.y - b.y, t.x - b.x), Math.min(1, dt * 6));
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
  bullets = bullets.filter(b => b.y > -30 && b.y < H + 30 && b.x > -30 && b.x < W + 30 && !b.dead);

  // --- spawning ---
  spawnClock += dt;
  while (spawnQ.length && spawnQ[0].at <= spawnClock) {
    const s = spawnQ.shift();
    const hp = enemyHp(s.t);
    enemies.push({ type: s.t, hp, maxHp: hp, c: s.c, r: s.r, x: s.pts[0].x, y: s.pts[0].y, state: 'enter',
      path: makePath(s.pts), speed: D.enterSpd, rot: 0, fireT: rand(1, 3), flash: 0, anim: rand(0, 10),
      entryShot: Math.random() < D.entryShot });
  }

  // --- enemies ---
  for (const e of enemies) {
    const ox0 = e.x, oy0 = e.y;
    const sp = slotPos(e.c, e.r);
    let teleported = false;
    if (e.state === 'enter' || e.state === 'dive') {
      const p = stepPath(e.path, e.speed * dt);
      if (p) { e.x = p.x; e.y = p.y; }
      else {
        if (e.state === 'dive') { e.x = sp.x; e.y = -30; teleported = true; e.rot = 0; }
        e.state = 'home';
      }
    } else if (e.state === 'home') {
      const dx = sp.x - e.x, dy = sp.y - e.y, d = Math.hypot(dx, dy);
      const step = Math.max(e.speed, 160) * dt;
      if (d <= step) { e.x = sp.x; e.y = sp.y; e.state = 'form'; }
      else { e.x += dx / d * step; e.y += dy / d * step; }
    } else { e.x = sp.x; e.y = sp.y; }

    if (!teleported) {
      const mx = e.x - ox0, my = e.y - oy0;
      const target = e.state === 'form' ? 0 : (mx * mx + my * my > 0.0001 ? Math.atan2(my, mx) - Math.PI / 2 : e.rot);
      e.rot = angLerp(e.rot, target, Math.min(1, dt * 9));
    }
    e.flash = Math.max(0, e.flash - dt);

    if (e.state === 'dive' && player.alive) {
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y < player.y - 90 && e.y > 0) {
        if (e.type === 'wedge' && wave >= 7) for (const s of [-0.22, 0, 0.22]) enemyShoot(e.x, e.y, true, D.bulletSpd, undefined, undefined, s);
        else enemyShoot(e.x, e.y, true, D.bulletSpd);
        e.fireT = rand(0.7, 1.5) / (1 + wave * 0.05);
      }
    }
    if (e.entryShot && e.state === 'enter' && e.y > H * 0.3 && player.alive) { e.entryShot = false; enemyShoot(e.x, e.y, true, D.bulletSpd * 0.85); }

    // ramming
    if (player.alive && player.inv <= 0) {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < TYPES[e.type].r + 9) { killEnemy(e); hitPlayer(); }
    }
  }
  scheduleDives(dt);

  if (D.formFire && player.alive) {
    formFireT -= dt;
    if (formFireT <= 0) {
      formFireT = D.formFire * rand(0.7, 1.3);
      const f = enemies.filter(e => e.state === 'form');
      if (f.length) { const e = pick(f); enemyShoot(e.x, e.y, true, D.bulletSpd * 0.8); }
    }
  }

  if (boss) updateBoss(dt);
  updateOutposts(dt);
  updateLegion(dt);

  // --- hazards (boss beams) ---
  for (const h of hazards) {
    if (h.follow && h.follow === boss) { h.ox = boss.x + h.fx; h.oy = boss.y + h.fy; }
    if (h.warn > 0) { h.warn -= dt; continue; }
    h.life -= dt; h.ang += h.dang * dt;
    if (player.alive && player.inv <= 0) {
      const ex = h.ox + Math.cos(h.ang) * 1500, ey = h.oy + Math.sin(h.ang) * 1500;
      if (segDist(player.x, player.y, h.ox, h.oy, ex, ey) < h.w / 2 + 5) hitPlayer(2);
    }
  }
  hazards = hazards.filter(h => h.life > 0 && (!h.follow || h.follow === boss));

  // --- lance beam ---
  player.lanceTop = 0;
  if (player.alive && player.lance > 0) {
    const lx = player.x;
    if (boss && boss.entered && !(boss.kind === 'shadow' && boss.inv > 0)) {
      for (let yy = player.y - 20; yy > 0; yy -= 6) if (bossShotHit(boss, lx, yy)) {
        player.lanceTop = yy;
        if (boss.inv > 0) { if (Math.random() < 0.3) particles.push({ x: lx, y: yy, vx: rand(-80, 80), vy: rand(-40, 40), life: 0.2, max: 0.3, c: '#5dff7a', s: 1.5 }); }
        else damageBoss(18 * dt, lx, yy);
        break;
      }
    }
    for (const e of enemies) {
      if (e.dead || e.y > player.y - 10 || e.y < player.lanceTop - 10) continue;
      if (Math.abs(e.x - lx) < TYPES[e.type].r + 4) { e.hp -= 18 * dt; e.flash = 0.05; if (e.hp <= 0) killEnemy(e); }
    }
    for (const m of mites) if (!m.dead && m.y < player.y && m.y > player.lanceTop && Math.abs(m.x - lx) < 12) killMite(m);
    for (const o of outposts) for (const t of o.targets) {
      const ty = o.y + t.oy;
      if (!t.dead && ty < player.y - 10 && ty > player.lanceTop - 10 && Math.abs(o.x + t.ox - lx) < 14) { t.hp -= 18 * dt; t.flash = 0.05; if (t.hp <= 0) hitTarget(o, t, 0); }
    }
  }

  // --- player bullets vs enemies / boss ---
  for (const bl of bullets) {
    if (bl.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      const r = TYPES[e.type].r;
      const dx = bl.x - e.x, dy = bl.y - e.y;
      if (dx * dx + dy * dy < r * r) {
        bl.dead = true; e.hp -= bl.dmg; e.flash = 0.08;
        if (e.hp <= 0) killEnemy(e); else sfx.hit();
        break;
      }
    }
    if (!bl.dead) for (const m of mites) {
      if (!m.dead && (bl.x - m.x) ** 2 + (bl.y - m.y) ** 2 < 10 * 10) { bl.dead = true; killMite(m); break; }
    }
    if (!bl.dead) for (const o of outposts) {
      const t = o.targets.find(t => !t.dead && (bl.x - o.x - t.ox) ** 2 + (bl.y - o.y - t.oy) ** 2 < 11 * 11);
      if (t) { bl.dead = true; hitTarget(o, t, bl.dmg); break; }
    }
    if (!bl.dead && boss && boss.entered && bossShotHit(boss, bl.x, bl.y)) {
      if (boss.inv > 0) {
        if (boss.kind === 'shadow') continue;   // phased out: shots pass straight through
        bl.dead = true;
        particles.push({ x: bl.x, y: bl.y, vx: rand(-60, 60), vy: rand(20, 80), life: 0.25, max: 0.3, c: '#5dff7a', s: 1.6 });
        continue;
      }
      bl.dead = true; sfx.hit();
      particles.push({ x: bl.x, y: bl.y, vx: rand(-60, 60), vy: rand(-80, -20), life: 0.25, max: 0.3, c: '#ffd27a', s: 1.6 });
      damageBoss(bl.dmg, bl.x, bl.y);
    }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  // --- enemy bullets ---
  for (const b of ebullets) {
    if (b.home > 0 && player.alive) {
      b.home -= dt;
      const sp = Math.hypot(b.vx, b.vy);
      const a = angLerp(Math.atan2(b.vy, b.vx), Math.atan2(player.y - b.y, player.x - b.x), Math.min(1, dt * 1.4));
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.burst > 0) {   // flak shell bursts into a ring
      b.burst -= dt;
      if (b.burst <= 0) { b.dead = true; ring(b.x, b.y, b.n || 8, 105, Math.random() * TAU); continue; }
    }
    if (player.alive && player.inv <= 0) {
      const dx = b.x - player.x, dy = b.y - player.y, rr = 8 + (b.r || 2);
      if (dx * dx + dy * dy < rr * rr) { b.dead = true; hitPlayer(); }
    }
  }
  ebullets = ebullets.filter(b => !b.dead && b.y < H + 20 && b.y > -60 && b.x > -20 && b.x < W + 20);

  // --- power-ups ---
  for (const p of powerups) {
    p.y += p.vy * dt;
    if (player.alive && Math.hypot(p.x - player.x, p.y - player.y) < 24) { p.dead = true; collectPower(p); }
  }
  powerups = powerups.filter(p => !p.dead && p.y < H + 20);
  updateGems(dt);
  updatePods(dt);

  updateFx(dt);

  // --- wave flow ---
  bannerT = Math.max(0, bannerT - dt);
  if (sectorCard) sectorCard.t += dt;
  if (!spawnQ.length && !enemies.length && !boss && nextWaveT === 0 && lives > 0) {
    if (practice) { bannerText = 'BOSS DEFEATED!'; bannerSub = 'Practice complete'; bannerT = 3; sfx.medal(); nextWaveT = 3.2; }
    else if (wave % 5 === 0) { finishSector(); nextWaveT = 4.5; } else nextWaveT = 1.8;
  }
  if (nextWaveT > 0) {
    nextWaveT -= dt;
    if (nextWaveT <= 0) { nextWaveT = 0; if (practice) { practice = null; state = 'title'; saveProgress(); } else startWave(wave + 1); }
  }
}

function updateFx(dt) {
  for (const p of particles) { p.life -= dt; if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; } }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.life -= dt; p.y -= 30 * dt; }
  popups = popups.filter(p => p.life > 0);
  shakeT = Math.max(0, shakeT - dt); if (shakeT === 0) shakeMag = 0;
  flashT = Math.max(0, flashT - dt);
  if (bombRing) { bombRing.t += dt; if (bombRing.t > 0.7) bombRing = null; }
}

// ============================================================
//  RENDER
// ============================================================
const FONT = 'Menlo, Consolas, "Courier New", monospace';
function text(s, x, y, size, color, align = 'center', weight = 'bold') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
const pauseBtn = () => ({ x: W - 26, y: safe.t + 24 });
const bombBtn = () => ({ x: W - 32, y: H - safe.b - 32 });
const BULLET_COL = [null, ['rgba(255,60,50,0.55)', '#ffe0d8'], ['rgba(255,60,50,0.55)', '#ffe0d8'], ['rgba(255,120,40,0.6)', '#fff0d8'],
  ['rgba(255,200,40,0.6)', '#fff8d8'], ['rgba(80,220,255,0.65)', '#effcff']];

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000008'; ctx.fillRect(0, 0, cv.width, cv.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-1, 1) * shakeMag; sy = rand(-1, 1) * shakeMag; }
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, (ox + sx * scale) * dpr, sy * scale * dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawBackground();

  if (state === 'title') { drawTitle(); ctx.restore(); return; }
  if (state === 'hangar') { drawHangar(); ctx.restore(); return; }

  drawOutposts();
  drawHoles();
  drawTrails();
  // ram warning column
  if (boss && boss.ram && boss.ram.stage === 'warn') {
    ctx.fillStyle = `rgba(255,40,40,${0.12 + 0.1 * Math.sin(clock * 25)})`; ctx.fillRect(boss.ram.x - 75, 0, 150, H);
    text('INCOMING!', boss.ram.x, H * 0.45, 16, '#ff5a4a');
  }
  drawPods();
  for (const p of powerups) drawPower(p);
  for (const g of gems) {
    glow(g.x, g.y, 9, 'rgba(255,210,80,0.45)', 'rgba(255,200,60,0)');
    drawStarShape(g.x, g.y, 5 + (g.val > 1 ? 1.5 : 0), g.spin); ctx.fillStyle = '#ffd34a'; ctx.fill();
    ctx.strokeStyle = '#fff6c8'; ctx.lineWidth = 0.6; ctx.stroke();
  }
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss(boss);
  drawMites();
  drawTractor();
  drawHazards();
  // enemy bolts: always red so they never blend in with the white stars
  for (const b of ebullets) {
    const r = (b.r || 1.9) + 0.4;
    ctx.globalAlpha = 0.6; glow(b.x, b.y, r * 3.4, '#ff2a1a', 'rgba(0,0,0,0)'); ctx.globalAlpha = 1;
    ctx.fillStyle = '#ff3b2a'; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffa090'; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.45, 0, TAU); ctx.fill();
  }
  // player shots
  ctx.lineCap = 'round';
  for (const b of bullets) {
    if (b.missile) {
      const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp;
      ctx.strokeStyle = 'rgba(255,150,50,0.6)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - ux * 14, b.y - uy * 14); ctx.stroke();
      ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(b.x, b.y, 2.4, 0, TAU); ctx.fill();
      continue;
    }
    const k = 12 / Math.hypot(b.vx, b.vy), c = BULLET_COL[b.lv];
    ctx.strokeStyle = c[0]; ctx.lineWidth = b.lv >= 4 ? 5 : 4;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * k, b.y - b.vy * k); ctx.stroke();
    ctx.strokeStyle = c[1]; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * k, b.y - b.vy * k); ctx.stroke();
  }
  if (player.alive && player.lance > 0) {
    const top = player.lanceTop, wv = 6 + Math.sin(clock * 50) * 1.5;
    ctx.strokeStyle = 'rgba(80,200,255,0.35)'; ctx.lineWidth = wv * 2.6;
    ctx.beginPath(); ctx.moveTo(player.x, player.y - 22); ctx.lineTo(player.x, top); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,235,255,0.9)'; ctx.lineWidth = wv;
    ctx.beginPath(); ctx.moveTo(player.x, player.y - 22); ctx.lineTo(player.x, top); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(player.x, player.y - 22); ctx.lineTo(player.x, top); ctx.stroke();
    if (top > 0) glow(player.x, top, 12, 'rgba(200,245,255,0.9)', 'rgba(80,200,255,0)');
  }
  if (player.alive && (player.inv <= 0 || Math.floor(clock * 12) % 2 === 0)) {
    drawFreighter(player.x, player.y, 1, clock);
    if (player.shield) {
      ctx.strokeStyle = `rgba(90,210,255,${0.55 + 0.25 * Math.sin(clock * 8)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y - 3, 25, 0, TAU); ctx.stroke();
    }
  }
  for (const p of particles) {
    const a = p.life / p.max;
    if (p.ring) {
      ctx.strokeStyle = `rgba(255,230,200,${a})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + (1 - a) * 3), 0, TAU); ctx.stroke();
    } else { ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); ctx.globalAlpha = 1; }
  }
  if (bombRing) {
    const k = bombRing.t / 0.7;
    ctx.strokeStyle = `rgba(255,120,160,${1 - k})`; ctx.lineWidth = 10 * (1 - k) + 2;
    ctx.beginPath(); ctx.arc(bombRing.x, bombRing.y, k * H * 1.1, 0, TAU); ctx.stroke();
  }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${flashT * 1.6})`; ctx.fillRect(0, 0, W, H); }
  for (const p of popups) { ctx.globalAlpha = Math.min(1, p.life * 2); text(p.txt, p.x, p.y, 11, p.col); ctx.globalAlpha = 1; }

  drawHud();
  if (bannerT > 0) {
    ctx.globalAlpha = Math.min(1, bannerT * 2);
    const isBoss = bannerText.startsWith('WARN');
    text(bannerText, W / 2, H * 0.52, isBoss ? 15 : 24, isBoss ? '#ff5a4a' : '#ffd27a');
    if (bannerSub) text(bannerSub, W / 2, H * 0.52 + 24, 11, '#9ab');
    ctx.globalAlpha = 1;
  }
  if (sectorCard && nextWaveT > 0 && state === 'play') drawSectorCard();
  if (paused) drawPause();
  if (state === 'over') drawOver();
  ctx.restore();
}

function drawHoles() {
  for (const h of holes) {
    if (h.t < h.warn) {
      const k = h.t / h.warn;
      ctx.globalAlpha = 0.4 + 0.3 * Math.sin(clock * 25); ctx.setLineDash([4, 5]); ctx.strokeStyle = '#c77dff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(h.x, h.y, 60 * (1 - k) + 14, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      continue;
    }
    const act = h.t - h.warn, s = Math.min(1, act * 3) * (act > h.life - 0.4 ? Math.max(0, (h.life - act) / 0.4) : 1);
    glow(h.x, h.y, 90 * s + 1, 'rgba(120,60,200,0.28)', 'rgba(120,60,200,0)');
    for (let k = 0; k < 3; k++) {
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(clock * (2 + k));
      ctx.beginPath(); ctx.ellipse(0, 0, (22 + k * 10) * s + 0.1, (8 + k * 4) * s + 0.1, 0, 0, TAU); neon(['#c77dff', '#ff7ad9', '#7f8cff'][k], 1);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(h.x, h.y, 12 * s + 0.1, 0, TAU); ctx.fillStyle = '#000'; ctx.fill(); ctx.strokeStyle = '#f0e0ff'; ctx.lineWidth = 1.2; ctx.stroke();
  }
}
function drawTrails() {   // flight-path arrows flowing along the swarm's route
  for (const tr of trails) {
    ctx.globalAlpha = tr.t < 1.1 ? 0.75 + 0.25 * Math.sin(clock * 20) : Math.max(0, 1 - (tr.t - 1.1) / 0.8) * 0.6;
    ctx.strokeStyle = '#ff6ae0'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = Math.floor(clock * 12) % 4; i + 1 < tr.pts.length; i += 4) {
      const p = tr.pts[i], q = tr.pts[i + 1];
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(q.y - p.y, q.x - p.x));
      ctx.beginPath(); ctx.moveTo(-5, -6); ctx.lineTo(2, 0); ctx.lineTo(-5, 6); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}
function drawMites() {
  for (const m of mites) {
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.rot - Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(-6, -5); ctx.lineTo(0, -2); ctx.lineTo(6, -5); ctx.closePath();
    ctx.fillStyle = '#3a0a30'; ctx.fill(); neon('#ff4ad8', 1.2);
    ctx.restore();
  }
}
function drawTractor() {
  const tr = boss && boss.tractor;
  if (!tr) return;
  const ox = boss.x, oy = boss.y + 36, wB = (H - oy) * 0.15 + 12;
  if (tr.stage === 'warn') {
    ctx.globalAlpha = 0.35 + 0.3 * Math.sin(clock * 25); ctx.setLineDash([5, 6]); ctx.strokeStyle = '#7fe0ff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox - wB, H); ctx.moveTo(ox, oy); ctx.lineTo(ox + wB, H); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    return;
  }
  const g = ctx.createLinearGradient(0, oy, 0, H);
  g.addColorStop(0, 'rgba(127,224,255,0.35)'); g.addColorStop(1, 'rgba(127,224,255,0.08)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(ox - 12, oy); ctx.lineTo(ox - wB, H); ctx.lineTo(ox + wB, H); ctx.lineTo(ox + 12, oy); ctx.closePath(); ctx.fill();
  const L = H - oy;
  ctx.strokeStyle = 'rgba(190,240,255,0.7)'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 12; k++) {
    const y = oy + (((k * 48 - tr.t * 160) % L) + L) % L, hw = (y - oy) * 0.15 + 12;
    ctx.beginPath(); ctx.ellipse(ox, y, hw, 4, 0, 0, TAU); ctx.stroke();
  }
  if (tr.hold > 0) text('BREAK FREE!', player.x, player.y + 30, 10, '#7fe0ff');
}

function drawOutposts() {
  for (const o of outposts) {
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.beginPath(); o.verts.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.closePath();
    const g = ctx.createRadialGradient(-o.r * 0.3, -o.r * 0.3, 2, 0, 0, o.r * 1.1);
    g.addColorStop(0, '#6b5a4c'); g.addColorStop(1, '#2a221c');
    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#1a1511'; ctx.lineWidth = 1; ctx.stroke();
    for (const [x, y, r] of o.craters) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = 'rgba(20,15,12,0.45)'; ctx.fill(); }
    for (const t of o.targets) {
      ctx.save(); ctx.translate(t.ox, t.oy);
      ctx.fillStyle = '#3d444c'; ctx.fillRect(-10, -10, 20, 20);
      ctx.strokeStyle = '#1c2025'; ctx.lineWidth = 1; ctx.strokeRect(-10, -10, 20, 20);
      if (t.dead) {
        ctx.fillStyle = '#0c0d0e'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
        glow(0, 0, 5 + Math.sin(clock * 9 + t.ox) * 1.2, 'rgba(255,130,40,0.6)', 'rgba(255,60,0,0)');
      } else if (t.kind === 'depot') {
        ctx.fillStyle = '#c9862e'; ctx.fillRect(-7, -7, 14, 14);
        ctx.fillStyle = '#2a1d0c'; for (let i = -7; i < 7; i += 5) ctx.fillRect(i, -7, 2, 14);
        glow(0, 0, 4, 'rgba(255,220,120,0.9)', 'rgba(255,180,0,0)');
      } else {
        ctx.fillStyle = '#7d8691'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
        ctx.save(); ctx.rotate(t.aim - Math.PI / 2); ctx.fillStyle = '#2b3036'; ctx.fillRect(-1.8, 2, 3.6, 11); ctx.restore();
        glow(0, 0, 3, 'rgba(255,70,50,1)', 'rgba(255,0,0,0)');
      }
      if (t.flash > 0) { ctx.globalAlpha = 0.7; glow(0, 0, 13, 'rgba(255,255,255,1)', 'rgba(255,255,255,0)'); ctx.globalAlpha = 1; }
      ctx.restore();
    }
    ctx.restore();
  }
}

function drawPods() {
  for (const p of pods) {
    ctx.strokeStyle = `rgba(125,255,138,${0.25 + 0.15 * Math.sin(clock * 5)})`; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.arc(p.x, p.y, 30, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    if (p.t > 0) { ctx.strokeStyle = '#7dff8a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 22, -Math.PI / 2, -Math.PI / 2 + p.t * TAU); ctx.stroke(); }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(clock * 2) * 0.2);
    ctx.fillStyle = '#d8dde3'; ctx.beginPath(); ctx.ellipse(0, 0, 7, 10, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#5a6068'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = '#3a8fd0'; ctx.beginPath(); ctx.ellipse(0, -2, 4, 4.5, 0, 0, TAU); ctx.fill();
    ctx.restore();
    if (Math.sin(clock * 8) > 0) glow(p.x, p.y + 11, 4, 'rgba(125,255,138,1)', 'rgba(0,255,60,0)');
    text('SOS', p.x, p.y - 18, 8, '#7dff8a');
  }
}

function drawSectorCard() {
  const c = sectorCard, k = Math.min(1, c.t * 3);
  const w = 300, h = 186, x = (W - w) / 2, y = H * 0.32;
  ctx.globalAlpha = k;
  ctx.fillStyle = 'rgba(6,10,24,0.92)'; ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 10) : ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
  text('SECTOR ' + c.no + ' CLEAR', W / 2, y + 24, 17, '#ffd27a');
  c.medals.forEach((m, i) => {
    const my = y + 60 + i * 34, shown = c.t > 0.4 + i * 0.35;
    ctx.beginPath(); ctx.arc(x + 26, my, 11, 0, TAU);
    ctx.fillStyle = shown && m.ok ? '#ffcc33' : '#2a2f3a'; ctx.fill();
    ctx.strokeStyle = shown && m.ok ? '#fff1b0' : '#555b66'; ctx.lineWidth = 1.5; ctx.stroke();
    if (shown && m.ok) { drawStarShape(x + 26, my, 6); ctx.fillStyle = '#a8700a'; ctx.fill(); }
    text(m.name, x + 46, my - 6, 10, shown && m.ok ? '#fff' : '#8a93a3', 'left');
    text(m.info, x + 46, my + 8, 9, '#9ab', 'left', 'normal');
    if (shown && m.ok) text('+' + c.bonus, x + w - 30, my, 11, '#ffd34a', 'right');
    if (shown && m.ok) drawStarIcon(x + w - 18, my, 5);
  });
  text('Next sector unlocked in the launch menu', W / 2, y + h - 16, 9, '#7fe0ff', 'center', 'normal');
  ctx.globalAlpha = 1;
}

function drawHazards() {
  ctx.lineCap = 'round';
  for (const h of hazards) {
    const ex = h.ox + Math.cos(h.ang) * 1500, ey = h.oy + Math.sin(h.ang) * 1500;
    if (h.warn > 0 && h.sweep) {         // shade the danger wedge; outside it is safe
      const a1 = h.ang + h.dang * h.life;
      ctx.globalAlpha = 0.12 + 0.06 * Math.sin(clock * 20); ctx.fillStyle = h.col;
      ctx.beginPath(); ctx.moveTo(h.ox, h.oy); ctx.arc(h.ox, h.oy, 1500, Math.min(h.ang, a1), Math.max(h.ang, a1)); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (h.warn > 0) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(clock * 30);
      ctx.strokeStyle = h.col; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(h.ox, h.oy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      glow(h.ox, h.oy, 6 + (1 - h.warn) * 10, h.col, 'rgba(0,0,0,0)');
    } else {
      ctx.globalAlpha = Math.min(1, h.life * 4);
      ctx.strokeStyle = h.col + '55'; ctx.lineWidth = h.w * 1.9;
      ctx.beginPath(); ctx.moveTo(h.ox, h.oy); ctx.lineTo(ex, ey); ctx.stroke();

}

const ICON_SCALE = { basestar: 0.24, fortress: 0.26, cube: 0.3, shadow: 0.3, harvester: 0.2, cruiser: 0.1, dread: 0.17, crab: 0.26, carrier: 0.2,

// ============================================================
//  INPUT
// ============================================================
let drag = null;
function toLogical(e) { return { x: (e.clientX - ox) / scale, y: e.clientY / scale }; }
function onTap(p) {
  if (state === 'title') {
    const L = titleLayout();
    if (L.save && inRect(p, L.cont.x, L.cont.y, L.cont.w, L.cont.h)) continueGame();
    else if (inRect(p, L.launch.x, L.launch.y, L.launch.w, L.launch.h)) newGame(startSector);
    else if (inRect(p, L.hangar.x, L.hangar.y, L.hangar.w, L.hangar.h)) state = 'hangar';
    else if (Math.hypot(p.x - L.sound.x, p.y - L.sound.y) < 24) toggleSound();
    else if (BOSSES.some((k, i) => { const q = iconPos(i); if (Math.abs(p.x - q.x) < 30 && Math.abs(p.y - q.y) < 21) { startPractice(k); return true; } return false; })) return;
    else if (unlocked > 1 && Math.abs(p.y - L.secY) < 22) {
      if (p.x < W / 2 - 60) startSector = Math.max(1, startSector - 1);
      else if (p.x > W / 2 + 60) startSector = Math.min(unlocked, startSector + 1);
    }
    return;
  }
  if (state === 'hangar') { hangarTap(p); return; }
  if (state === 'over') {
    if (overT <= 1) return;
    const B = overBtns();
    if (inRect(p, B.again.x, B.again.y, B.again.w, B.again.h)) newGame(startSector);
    else if (inRect(p, B.hangar.x, B.hangar.y, B.hangar.w, B.hangar.h)) state = 'hangar';
    return;
  }
  if (paused) {
    if (inRect(p, W / 2, H / 2, 180, 42)) toggleSound();
    else if (inRect(p, W / 2, H / 2 + 56, 180, 42)) { paused = false; state = 'title'; practice = null; saveProgress(); }
    else paused = false;
    return;
  }
  const pb = pauseBtn();
  if (Math.hypot(p.x - pb.x, p.y - pb.y) < 24) { paused = true; return; }
  const bb = bombBtn();
  if (player.bombs > 0 && Math.hypot(p.x - bb.x, p.y - bb.y) < 28) { useBomb(); return; }
  drag = { sx: p.x, sy: p.y, px: player.x, py: player.y };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio(); const p = toLogical(e);
  const wasDragging = drag;
  // a second finger can tap the bomb button without interrupting steering
  if (wasDragging && state === 'play' && !paused) {
    const bb = bombBtn();
    if (Math.hypot(p.x - bb.x, p.y - bb.y) < 28) useBomb();
    return;
  }
  drag = null; onTap(p); if (drag) drag.id = e.pointerId;
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || !player.alive || paused || state !== 'play') return;
  const p = toLogical(e);
  const nx = drag.px + (p.x - drag.sx) * 1.35;
  const ny = drag.py + (p.y - drag.sy) * 1.35;
  player.x = clamp(nx, 20, W - 20);
  player.y = clamp(ny, minPlayerY(), maxPlayerY());
  if (player.x !== nx) { drag.sx = p.x; drag.px = player.x; }
  if (player.y !== ny) { drag.sy = p.y; drag.py = player.y; }
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchend', () => initAudio(), { passive: true });
document.addEventListener('click', () => initAudio());
cv.addEventListener('pointerup', () => initAudio());
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  keys[e.key] = true; initAudio();
  if (e.key === ' ' || e.key === 'Enter') {
    if (state === 'title') continueGame();
    else if (state === 'over' && overT > 1) newGame(startSector);
    else if (state === 'hangar') state = 'title';
    else if (state === 'play') paused = !paused;
  }
  if ((e.key === 'p' || e.key === 'Escape') && state === 'play') paused = !paused;
  if (e.key === 'b' || e.key === 'B') useBomb();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') paused = true; saveProgress(); }
  else if (AC && AC.state !== 'running') { try { AC.resume().catch(() => {}); } catch (e) {} }
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// ============================================================
//  LOOP
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  clock += dt;
  if (state === 'play' && !paused) update(dt);
  else if (state === 'over') { overT += dt; T += dt; updateStars(dt); updateFx(dt); }
  else if (state === 'title' || state === 'hangar') { starBoost = 1; updateStars(dt); }
  render();
  requestAnimationFrame(frame);
}
D = diff(1);
resize();
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- Self-update ----------
// The Pi's simple web server sends no cache headers, so the iPhone home-screen app
// can keep an old copy. On launch (and when reopened) ask for version.json, bypassing
// the cache; if it names a newer build, refresh the cached page and reload it.
const BUILD = '2026-11-21a';
async function checkForUpdate() {
  if (state === 'play' && !paused) return;            // never interrupt a game
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    const v = (await r.json()).build;
    if (!v || v === BUILD) return;
    let tried = null; try { tried = sessionStorage.getItem('ns_update'); } catch (e) {}
    if (tried === v) return;                          // already tried this build; avoid reload loops
    try { sessionStorage.setItem('ns_update', v); } catch (e) {}
    await fetch('index.html', { cache: 'reload' });   // replace the stale cached page
    location.replace('index.html?v=' + encodeURIComponent(v));
  } catch (e) {}
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });

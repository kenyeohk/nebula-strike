<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nebula Strike">
<meta name="theme-color" content="#000008">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Nebula Strike</title>
<style>
  html, body { margin: 0; height: 100%; background: #000008; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
    -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
'use strict';
// ============================================================
//  NEBULA STRIKE — an arcade formation shooter for iPhone
// ============================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angLerp = (a, b, t) => { const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; };
const pick = arr => arr[(Math.random() * arr.length) | 0];
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function inTri(px, py, ax, ay, bx, by, cx, cy) {
  const d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by);
  const d2 = (px - cx) * (by - cy) - (bx - cx) * (py - cy);
  const d3 = (px - ax) * (cy - ay) - (cx - ax) * (py - ay);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
}

// ---------- Screen / scaling ----------
const W = 360;              // logical width; height adapts to the phone
let H = 640, scale = 1, dpr = 1, ox = 0;
const safe = { t: 0, b: 0, l: 0, r: 0 };
let fTop = 80;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = vw / W; H = vh / scale;
  if (H < 560) { H = 560; scale = vh / H; }
  ox = (vw - W * scale) / 2;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  const cs = getComputedStyle(document.getElementById('safe'));
  safe.t = (parseFloat(cs.paddingTop) || 0) / scale;
  safe.b = (parseFloat(cs.paddingBottom) || 0) / scale;
  fTop = safe.t + 78;
  player.y = clamp(player.y, minPlayerY(), maxPlayerY());
  makeStars();
}
function playerY() { return H - safe.b - 80; }
// The ship can roam the lower part of the screen
function minPlayerY() { return Math.max(fTop + 110, H * 0.28); }
function maxPlayerY() { return H - safe.b - 50; }

// ---------- Audio (synthesised, no files) ----------
// iPhone rules: Web Audio may only start inside a real tap (touchend / click,
// not touchstart); the silent switch mutes it unless the audio session is
// "playback"; and iOS interrupts it whenever the app goes to the background,
// so every tap checks that it is still running.
let AC = null, master = null, noiseBuf = null, silentEl = null;
let soundOn = load('ns_sound', '1') === '1';
function initAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!AC) {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    AC = new A();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 1.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state !== 'running') { try { AC.resume().catch(() => {}); } catch (e) {} }
  // a silent blip inside the gesture unlocks older iOS versions
  const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(master); s.start(0);
  // older iOS without audioSession: a looping silent <audio> element puts the
  // phone in playback mode so the silent switch doesn't mute the game
  if (!navigator.audioSession && isIOS && !silentEl) {
    silentEl = new Audio(silentWav()); silentEl.loop = true;
    silentEl.play().catch(() => { silentEl = null; });
  }
}
function silentWav() {
  const n = 4000, buf = new Uint8Array(44 + n), v = new DataView(buf.buffer);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) buf[o + i] = s.charCodeAt(i); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  buf.fill(128, 44);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function toggleSound() {
  soundOn = !soundOn; store('ns_sound', soundOn ? '1' : '0');
  if (soundOn) { initAudio(); sfx.power(); }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  shoot: () => tone('square', 1500, 280, 0.07, 0.03),
  missile: () => tone('sawtooth', 300, 900, 0.12, 0.03),
  hit: () => tone('square', 320, 140, 0.05, 0.05),
  boom: () => { noise(0.45, 0.45, 2200); tone('sine', 180, 40, 0.3, 0.2); },
  bigboom: () => { noise(1.4, 0.8, 1500); tone('sine', 110, 25, 1.2, 0.5); },
  die: () => { noise(1.1, 0.7, 2600); tone('sawtooth', 600, 40, 1.0, 0.18); },
  power: () => { tone('triangle', 660, 990, 0.09, 0.18); tone('triangle', 880, 1320, 0.09, 0.18, 0.08); tone('triangle', 1170, 1760, 0.14, 0.18, 0.16); },
  levelup: () => { [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.1, 0.09, i * 0.08)); },
  shield: () => { tone('sine', 900, 200, 0.35, 0.25); noise(0.3, 0.2, 4000); },
  wave: () => { tone('triangle', 330, 330, 0.12, 0.15); tone('triangle', 440, 440, 0.12, 0.15, 0.13); tone('triangle', 660, 660, 0.25, 0.15, 0.26); },
  alarm: () => { for (let i = 0; i < 3; i++) tone('sawtooth', 420, 300, 0.22, 0.09, i * 0.3); },
  charge: () => tone('sine', 180, 1400, 1.1, 0.12),
  beam: () => { noise(0.9, 0.35, 3000); tone('sawtooth', 95, 60, 0.9, 0.18); },
  horn: () => { tone('sawtooth', 62, 52, 1.6, 0.22); tone('sawtooth', 93, 78, 1.6, 0.14); noise(1.2, 0.15, 400); },
  teleport: () => tone('sine', 1400, 90, 0.45, 0.15),
  bomb: () => { noise(1.5, 0.9, 5000); tone('sine', 90, 20, 1.4, 0.6); },
  adapt: () => { tone('square', 200, 200, 0.08, 0.1); tone('square', 300, 300, 0.08, 0.1, 0.1); },
  coin: () => tone('triangle', 1700, 2500, 0.06, 0.05),
  hurt: () => { noise(0.25, 0.35, 3000); tone('square', 260, 90, 0.2, 0.08); },
  rescue: () => { tone('sine', 520, 1040, 0.18, 0.15); tone('sine', 780, 1560, 0.22, 0.12, 0.12); },
  buy: () => { [660, 880, 1320].forEach((f, i) => tone('triangle', f, f, 0.1, 0.12, i * 0.07)); },
  deny: () => tone('square', 170, 120, 0.18, 0.08),
  medal: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f, 0.16, 0.12, i * 0.1)); },
  tractor: () => { tone('sine', 220, 660, 2.2, 0.1); tone('triangle', 330, 990, 2.2, 0.05); },
};

// ---------- Background ----------
let stars = [], starBoost = 1;
function makeStars() {
  stars = [];
  for (let i = 0; i < 150; i++) {
    const l = i % 3;
    stars.push({ x: Math.random() * W, y: Math.random() * H, l, s: [0.7, 1.1, 1.7][l], v: [14, 36, 85][l], tw: Math.random() * TAU });
  }
}
function updateStars(dt) {
  for (const s of stars) {
    s.y += s.v * dt * starBoost;
    if (s.y > H) { s.y -= H + 2; s.x = Math.random() * W; }
  }
}
function drawBackground() {
  const n1y = (clock * 6) % (H + 400) - 200;
  let g = ctx.createRadialGradient(W * 0.25, n1y, 10, W * 0.25, n1y, 220);
  g.addColorStop(0, 'rgba(90,40,140,0.22)'); g.addColorStop(1, 'rgba(90,40,140,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const n2y = ((clock * 4) + H * 0.6) % (H + 400) - 200;
  g = ctx.createRadialGradient(W * 0.8, n2y, 10, W * 0.8, n2y, 200);
  g.addColorStop(0, 'rgba(20,90,140,0.2)'); g.addColorStop(1, 'rgba(20,90,140,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    const a = s.l === 2 ? 0.9 : (0.35 + 0.35 * Math.sin(clock * 2 + s.tw)) + s.l * 0.15;
    ctx.fillStyle = s.l === 2 ? `rgba(220,235,255,${a})` : `rgba(180,200,255,${a})`;
    const len = s.l === 2 ? s.s * (1 + (starBoost - 1) * 6) : s.s;
    ctx.fillRect(s.x, s.y, s.s, len);
  }
}

// ============================================================
//  SHIP ART (all drawn in code, nose pointing DOWN for enemies)
// ============================================================
function glow(x, y, r, inner, outer) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, inner); g.addColorStop(1, outer);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}

// Player: "Corsair-class" saucer freighter — round hull, twin forward
// mandibles, offset cockpit pod and a wide blue sublight engine glow.
function drawFreighter(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const fl = Math.sin(t * 40) * 0.8;
  const g = ctx.createRadialGradient(0, 12, 1, 0, 13, 17);
  g.addColorStop(0, 'rgba(210,240,255,0.95)'); g.addColorStop(0.35, 'rgba(90,170,255,0.7)'); g.addColorStop(1, 'rgba(40,90,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 13, 15, 7 + fl, 0, 0, TAU); ctx.fill();
  ctx.lineWidth = 0.8; ctx.strokeStyle = '#5a6068';
  ctx.fillStyle = '#b4b9c0';
  for (const sd of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(sd * 10, -5); ctx.lineTo(sd * 8.5, -22); ctx.lineTo(sd * 2.6, -22); ctx.lineTo(sd * 2.2, -8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8b9199'; ctx.fillRect(sd > 0 ? 4 : -7, -18, 3, 2); ctx.fillStyle = '#b4b9c0';
  }
  ctx.beginPath(); ctx.arc(0, 0, 13.5, 0, TAU);
  const hg = ctx.createLinearGradient(-13, -13, 13, 13);
  hg.addColorStop(0, '#e2e5ea'); hg.addColorStop(1, '#9ca2aa');
  ctx.fillStyle = hg; ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#cfefff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 12.6, Math.PI * 0.22, Math.PI * 0.78); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,86,94,0.7)'; ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, TAU); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = i * TAU / 8 + 0.2;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 6.5, Math.sin(a) * 6.5); ctx.lineTo(Math.cos(a) * 12.5, Math.sin(a) * 12.5); ctx.stroke();
  }
  ctx.fillStyle = '#b0533c'; ctx.fillRect(-9, 2, 3.5, 2.5); ctx.fillRect(5, -8, 3, 2); ctx.fillRect(-4, 8, 3, 2);
  ctx.fillStyle = '#6b7179'; ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#a3a9b1'; ctx.beginPath(); ctx.ellipse(-5.5, 5.5, 2.8, 2.2, 0.5, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c9cdd3'; ctx.strokeStyle = '#5a6068'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(9, -5); ctx.lineTo(14, -10); ctx.lineTo(15.5, -8.2); ctx.lineTo(11, -2.5); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(15.2, -11, 3.3, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#28394a'; ctx.beginPath(); ctx.arc(15.6, -12, 1.6, 0, TAU); ctx.fill();
  ctx.restore();
}

// Twin-panel interceptor: ball cockpit between two hexagonal wing panels
function drawInter(t) {
  ctx.fillStyle = '#646c75'; ctx.fillRect(-11, -1.6, 22, 3.2);
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(s * 12.5, 0);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + Math.PI / 2; ctx.lineTo(Math.cos(a) * 6.2, Math.sin(a) * 11.5); }
    ctx.closePath(); ctx.fillStyle = '#242a31'; ctx.fill();
    ctx.strokeStyle = '#a0aab4'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + Math.PI / 2; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 6.2, Math.sin(a) * 11.5); }
    ctx.strokeStyle = 'rgba(160,170,180,0.45)'; ctx.lineWidth = 0.6; ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, 5.8, 0, TAU); ctx.fillStyle = '#a9b2bc'; ctx.fill();
  ctx.strokeStyle = '#5b636c'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0.6, 3.1, 0, TAU); ctx.fillStyle = '#121d26'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,255,160,0.75)'; ctx.lineWidth = 0.5;
  ctx.beginPath(); for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4; ctx.moveTo(Math.cos(a) * 3, 0.6 + Math.sin(a) * 3); ctx.lineTo(-Math.cos(a) * 3, 0.6 - Math.sin(a) * 3); } ctx.stroke();
}

// Wedge destroyer: dagger-shaped capital ship with a bridge tower
function drawWedge(t, e) {
  for (const x of [-7, 0, 7]) glow(x, -12, 3.6, 'rgba(170,220,255,0.95)', 'rgba(60,120,255,0)');
  ctx.beginPath(); ctx.moveTo(0, 17); ctx.lineTo(-13.5, -11); ctx.lineTo(13.5, -11); ctx.closePath();
  ctx.fillStyle = '#d6d9de'; ctx.fill(); ctx.strokeStyle = '#6b7179'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 17); ctx.lineTo(13.5, -11); ctx.lineTo(0, -11); ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fill();
  ctx.strokeStyle = 'rgba(90,96,104,0.75)'; ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.moveTo(0, 15); ctx.lineTo(0, -11); ctx.moveTo(-9, -3); ctx.lineTo(9, -3); ctx.moveTo(-5, 5); ctx.lineTo(5, 5); ctx.stroke();
  ctx.fillStyle = '#b8bcc2'; ctx.fillRect(-4.5, -15, 9, 6); ctx.fillRect(-2, -18, 4, 3);
  ctx.beginPath(); ctx.arc(-3.2, -18.3, 1.4, 0, TAU); ctx.arc(3.2, -18.3, 1.4, 0, TAU); ctx.fill();
  if (e && e.hp < e.maxHp) { // damage sparks
    glow(-5 + Math.sin(t * 13) * 2, 2, 3, 'rgba(255,190,90,0.9)', 'rgba(255,90,30,0)');
    if (e.hp <= e.maxHp / 2) glow(5, -4 + Math.sin(t * 11) * 2, 3, 'rgba(255,190,90,0.9)', 'rgba(255,90,30,0)');
  }
}

// Crescent raider: curved wing body with a sweeping red scanner eye
function drawRaider(t) {
  glow(-6, -9, 3, 'rgba(255,140,90,0.8)', 'rgba(255,60,30,0)');
  glow(6, -9, 3, 'rgba(255,140,90,0.8)', 'rgba(255,60,30,0)');
  ctx.beginPath();
  ctx.moveTo(-16, 10); ctx.quadraticCurveTo(-13, -12, 0, -12); ctx.quadraticCurveTo(13, -12, 16, 10);
  ctx.quadraticCurveTo(11, 1, 6, 1); ctx.lineTo(0, 7); ctx.lineTo(-6, 1); ctx.quadraticCurveTo(-11, 1, -16, 10);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -12, 0, 10); g.addColorStop(0, '#b2b6bb'); g.addColorStop(1, '#5b5f64');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#34373b'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 1, 5.6, 6.2, 0, 0, TAU); ctx.fillStyle = '#7b8086'; ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1a0505'; ctx.fillRect(-4.6, 3.6, 9.2, 2.4);
  const ex = Math.sin(t * 5) * 3.4;
  glow(ex, 4.8, 4.5, 'rgba(255,60,40,1)', 'rgba(255,0,0,0)');
}

// Raptor warbird: forward head on a long neck, swept wings with tip cannons
function drawBird(t) {
  glow(0, -11, 4, 'rgba(255,110,80,0.9)', 'rgba(255,40,20,0)');
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 3, -8); ctx.lineTo(s * 17.5, 1); ctx.lineTo(s * 17.5, 7); ctx.lineTo(s * 13, 5); ctx.lineTo(s * 3, 1); ctx.closePath();
    ctx.fillStyle = '#4b6846'; ctx.fill(); ctx.strokeStyle = '#a9c4a2'; ctx.lineWidth = 0.9; ctx.stroke();
    ctx.fillStyle = '#c3d0be'; ctx.fillRect(s * 17.5 - 1, 6, 2, 6);
    ctx.strokeStyle = 'rgba(169,196,162,0.5)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(s * 5, -4); ctx.lineTo(s * 15, 2.5); ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(0, -5, 5.6, 6.6, 0, 0, TAU); ctx.fillStyle = '#5d7d57'; ctx.fill(); ctx.strokeStyle = '#a9c4a2'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = '#6f8e68'; ctx.fillRect(-1.7, 0, 3.4, 9);
  ctx.beginPath(); ctx.ellipse(0, 11, 4.4, 3.3, 0, 0, TAU); ctx.fillStyle = '#80a178'; ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff6a40'; ctx.fillRect(-1.8, 11.5, 3.6, 1.3);
}

// Hive drone: small spinning gridded cube launched by the Hive Cube
function drawDrone(t) {
  ctx.save(); ctx.rotate(t * 1.5);
  ctx.fillStyle = '#1d241d'; ctx.strokeStyle = '#5dff7a'; ctx.lineWidth = 1;
  ctx.fillRect(-7.5, -7.5, 15, 15); ctx.strokeRect(-7.5, -7.5, 15, 15);
  ctx.strokeStyle = 'rgba(93,255,122,0.5)';
  ctx.beginPath(); ctx.moveTo(-7.5, 0); ctx.lineTo(7.5, 0); ctx.moveTo(0, -7.5); ctx.lineTo(0, 7.5); ctx.stroke();
  ctx.restore();
  glow(0, 0, 4.5, 'rgba(140,255,150,1)', 'rgba(0,255,60,0)');
}

const TYPES = {
  inter:  { hp: 1, score: 50,  dive: 100, r: 13, draw: drawInter,  name: 'Twin-Panel Interceptor', colors: ['#fff', '#9fe8a0', '#6a747e', '#ffcc66'] },
  raider: { hp: 1, score: 80,  dive: 160, r: 13, draw: drawRaider, name: 'Crescent Raider',        colors: ['#fff', '#ff5a4a', '#ffb27a', '#9aa0a6'] },
  bird:   { hp: 1, score: 100, dive: 200, r: 13, draw: drawBird,   name: 'Raptor Warbird',         colors: ['#fff', '#b8ff9a', '#ffb04a', '#5f7d58'] },
  wedge:  { hp: 3, score: 150, dive: 400, r: 14, draw: drawWedge,  name: 'Wedge Destroyer',        colors: ['#fff', '#ffd27a', '#ff8a3a', '#c8ccd2'] },

// 1. Hexa Basestar — two counter-rotating three-armed stars around a hub
function drawBasestar(b) {
  for (let layer = 0; layer < 2; layer++) {
    const a0 = layer ? -b.rot * 0.7 + Math.PI / 3 : b.rot;
    for (let k = 0; k < 3; k++) {
      ctx.save(); ctx.rotate(a0 + k * TAU / 3);
      ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(-13, 43); ctx.lineTo(-6, 50); ctx.lineTo(6, 50); ctx.lineTo(13, 43); ctx.lineTo(8, 8); ctx.closePath();
      ctx.fillStyle = layer ? '#9ca2a9' : '#5f646b'; ctx.fill();
      ctx.strokeStyle = '#3b3f45'; ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = 'rgba(50,54,60,0.6)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); for (const y of [19, 29, 39]) { const w = 8 + (y - 8) * 5 / 35; ctx.moveTo(-w, y); ctx.lineTo(w, y); } ctx.stroke();
      if (Math.sin(clock * 6 + k * 2 + layer) > 0) glow(0, 46, 3.5, 'rgba(255,70,50,1)', 'rgba(255,0,0,0)');
      ctx.restore();
    }
  }
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fillStyle = '#8a9097'; ctx.fill(); ctx.strokeStyle = '#3b3f45'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.strokeStyle = '#5a5f66'; ctx.lineWidth = 1.5; ctx.stroke();
  glow(0, 0, 7 + Math.sin(clock * 4) * 1.5, 'rgba(255,80,60,1)', 'rgba(255,0,0,0)');
}

// 2. Moon Fortress — armoured battle-moon with an equatorial trench and a superlaser dish
function drawFortress(b) {
  const R = 46;
  const g = ctx.createRadialGradient(-16, -18, 4, 0, 0, R);
  g.addColorStop(0, '#d3d7dc'); g.addColorStop(0.6, '#8d939a'); g.addColorStop(1, '#41464d');
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(40,44,50,0.55)'; ctx.lineWidth = 0.7;
  for (const y of [-34, -22, -10, 12, 24, 36]) { const w = Math.sqrt(R * R - y * y); ctx.beginPath(); ctx.moveTo(-w, y); ctx.lineTo(w, y); ctx.stroke(); }
  for (const x of [-28, -12, 6, 24]) { ctx.beginPath(); ctx.moveTo(x, -Math.sqrt(R * R - x * x) * 0.9); ctx.lineTo(x * 1.08, Math.sqrt(R * R - x * x) * 0.9); ctx.stroke(); }
  ctx.fillStyle = '#2c3036'; ctx.fillRect(-R + 1, -1.8, R * 2 - 2, 3.6);   // trench
  // surface lights
  ctx.fillStyle = 'rgba(255,240,180,0.8)';
  for (const l of b.lights) { const x = Math.cos(l.a + b.rot) * l.r * R * 0.85, y = Math.sin(l.a * 3) * l.r * R * 0.8; if (Math.cos(l.a + b.rot) > -0.3) ctx.fillRect(x, y, 1.2, 1.2); }
  // superlaser dish
  const dx = 16, dy = -15, dr = 12;
  const dg = ctx.createRadialGradient(dx - 3, dy - 3, 1, dx, dy, dr);
  dg.addColorStop(0, '#5d636a'); dg.addColorStop(1, '#a9afb6');
  ctx.beginPath(); ctx.arc(dx, dy, dr, 0, TAU); ctx.fillStyle = dg; ctx.fill(); ctx.strokeStyle = '#3a3e44'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(40,44,50,0.7)'; ctx.lineWidth = 0.6;
  ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * TAU / 8; ctx.moveTo(dx + Math.cos(a) * dr, dy + Math.sin(a) * dr); ctx.lineTo(dx, dy); } ctx.stroke();
  const c = b.charge > 0 ? 1 - b.charge / 1.2 : 0;
  glow(dx, dy, 3 + c * 16, `rgba(150,255,140,${0.4 + c * 0.6})`, 'rgba(60,255,60,0)');
}

// 3. Hive Cube — a rotating gridded cube that adapts to your weapons
const CUBE_FACES = [[0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1], [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]];
function drawCube(b) {
  const s = 33, a = b.rot, tilt = 0.5, ca = Math.cos(a), sa = Math.sin(a), ct = Math.cos(tilt), st = Math.sin(tilt);
  const v = [];
  for (let i = 0; i < 8; i++) {
    const x = (i & 4 ? 1 : -1), y = (i & 2 ? 1 : -1), z = (i & 1 ? 1 : -1);
    const x1 = x * ca + z * sa, z1 = -x * sa + z * ca;
    const y2 = y * ct - z1 * st, z2 = y * st + z1 * ct;
    v.push({ x: x1 * s, y: y2 * s, z: z2 });
  }
  const faces = CUBE_FACES.map(f => ({ f, z: (v[f[0]].z + v[f[1]].z + v[f[2]].z + v[f[3]].z) / 4 })).sort((p, q) => p.z - q.z);
  glow(0, 0, 70, 'rgba(60,255,90,0.18)', 'rgba(60,255,90,0)');
  for (const { f, z } of faces) {
    const p = f.map(i => v[i]);
    ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y); for (let i = 1; i < 4; i++) ctx.lineTo(p[i].x, p[i].y); ctx.closePath();
    const shade = Math.round(18 + (z + 1) * 14);
    ctx.fillStyle = `rgb(${shade},${shade + 6},${shade})`; ctx.fill();
    ctx.strokeStyle = 'rgba(93,255,122,0.9)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(93,255,122,0.35)'; ctx.lineWidth = 0.6; ctx.beginPath();
    for (let k = 1; k < 4; k++) {
      const t = k / 4;
      ctx.moveTo(lerp(p[0].x, p[1].x, t), lerp(p[0].y, p[1].y, t)); ctx.lineTo(lerp(p[3].x, p[2].x, t), lerp(p[3].y, p[2].y, t));
      ctx.moveTo(lerp(p[0].x, p[3].x, t), lerp(p[0].y, p[3].y, t)); ctx.lineTo(lerp(p[1].x, p[2].x, t), lerp(p[1].y, p[2].y, t));
    }
    ctx.stroke();
    if (z > 0) {
      ctx.fillStyle = 'rgba(140,255,150,0.85)';
      for (let k = 0; k < 3; k++) { const t1 = (Math.sin(clock * 2 + k * 2.1 + z) + 1) / 2, t2 = (k + 0.5) / 3; ctx.fillRect(lerp(lerp(p[0].x, p[1].x, t1), lerp(p[3].x, p[2].x, t1), t2) - 1, lerp(lerp(p[0].y, p[1].y, t1), lerp(p[3].y, p[2].y, t1), t2) - 1, 2, 2); }
    }
  }
  if (b.inv > 0) {
    ctx.strokeStyle = `rgba(93,255,122,${0.4 + 0.3 * Math.sin(clock * 20)})`; ctx.lineWidth = 2.5;
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const an = i * TAU / 6 + clock; ctx.lineTo(Math.cos(an) * 58, Math.sin(an) * 58); } ctx.closePath(); ctx.stroke();
  }
}

// 4. Shadow Spider — black, organic, spiked crystalline ship with an iridescent sheen

// 5. Harvester — a towering cuttlefish-shaped machine with hanging legs and a red core
function drawHarvester(b) {

    ctx.strokeStyle = '#55525b'; ctx.lineWidth = 1;

  // red underside lights
  for (const x of [-12, -4, 4, 12]) glow(x, 4, 2.5, 'rgba(255,80,60,0.9)', 'rgba(255,0,0,0)');

}

// 6. Ludicrous Cruiser — an absurdly long royal flagship with an oversized engine

}

  ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(-7, 18); ctx.lineTo(-40, -95); ctx.lineTo(-33, -95); ctx.lineTo(0, 22); ctx.lineTo(33, -95); ctx.lineTo(40, -95); ctx.lineTo(7, 18); ctx.closePath(); ctx.fill();

// ---- Multi-part bosses: knock out the parts first, then the core opens up ----
const BOSS_PARTS = {

// 7. Iron Dreadnought — a long armoured battleship with four deck turrets

  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#1f2328'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.strokeStyle = 'rgba(25,28,33,0.55)'; ctx.lineWidth = 0.7; ctx.beginPath();

// 8. Titan Crab — a giant armoured walker with two beam-firing claws
function drawClaw(b, p) {
  ctx.save(); ctx.translate(p.ox, p.oy);

function drawCrab(b) {

    const s = Math.sign(p.ox);

const BOSSES = ['basestar', 'mantis', 'fortress', 'brood', 'dread', 'cube', 'well', 'shadow', 'crab', 'twins', 'harvester', 'warden', 'cruiser', 'serpent', 'carrier'];
const BOSS_INFO = {

  cube:      { name: 'HIVE CUBE',         tag: 'It adapts to your weapons',    hp: 1.3, ty: 12, draw: drawCube,      flash: 50 },
  shadow:    { name: 'SHADOW SPIDER',     tag: 'It phases between dimensions', hp: 1.2, ty: 16, draw: drawShadow,    flash: 34 },

function drawBoss(b) {
  ctx.save(); ctx.translate(b.x, b.y); ctx.globalAlpha = b.alpha;
  BOSS_INFO[b.kind].draw(b);
  ctx.globalAlpha = 1;
  if (b.flash > 0) { ctx.globalAlpha = Math.min(1, b.flash * 10) * 0.5; glow(0, 0, BOSS_INFO[b.kind].flash, 'rgba(255,255,255,1)', 'rgba(255,255,255,0)'); ctx.globalAlpha = 1; }
  ctx.restore();
}
function bossHit(b, x, y) {
  const dx = x - b.x, dy = y - b.y;
  switch (b.kind) {
    case 'basestar': return dx * dx + dy * dy < 40 * 40;
    case 'fortress': return dx * dx + dy * dy < 46 * 46;
    case 'cube':     return dx * dx + dy * dy < 40 * 40;
    case 'shadow':   return dx * dx + dy * dy < 30 * 30;
    case 'harvester': return (dx / 30) ** 2 + ((dy + 30) / 50) ** 2 < 1 || (Math.abs(dx) < 28 && dy > 0 && dy < 44);
    case 'cruiser':  return inTri(x, y, b.x, b.y + 72, b.x - 75, b.y - 170, b.x + 75, b.y - 170) || (Math.abs(dx) < 64 && dy > -200 && dy < -168);
    case 'dread':    return inTri(x, y, b.x, b.y + 80, b.x - 30, b.y + 34, b.x + 30, b.y + 34) || (Math.abs(dx) < 35 && dy > -128 && dy < 36);
    case 'crab':     return (dx / 52) ** 2 + (dy / 32) ** 2 < 1 || !!partAt(b, x, y);
    case 'carrier':  return (dx / 84) ** 2 + (dy / 26) ** 2 < 1;
    case 'mantis':   return (dx / 30) ** 2 + ((dy + 4) / 42) ** 2 < 1;
    case 'brood':    return dx * dx + dy * dy < 36 * 36;
    case 'well':     return dx * dx + dy * dy < 30 * 30;
    case 'twins': {
      const [a, c] = b.parts;
      return !!partAt(b, x, y) || (!a.dead && !c.dead && segDist(x, y, b.x + a.ox, b.y + a.oy, b.x + c.ox, b.y + c.oy) < 5);
    }
    case 'warden':   return dx * dx + dy * dy < 26 * 26 || !!partAt(b, x, y);
    case 'serpent':  return dx * dx + dy * dy < 18 * 18 || !!partAt(b, x, y);
  }
  return false;
}
// Where a player shot lands. Multi-part bosses sit "below" you like a ground
// target: shots fly over the armoured hull and only hit live parts, until the
// last part falls and the core opens up.
function bossShotHit(b, x, y) {
  if (!b.parts) return bossHit(b, x, y);
  return !!partAt(b, x, y) || (exposed(b) && bossHit(b, x, y));
}

const maxHull = () => 2 + U('hull');
const startLevel = () => 1 + Math.floor(U('cannon') / 2);
const magnetR = () => 55 + U('magnet') * 35;
const maxBombs = () => 3 + U('bomb');
const powerMul = () => 1 + U('power') * 0.3;

// Everything that ramps up as the waves go on
function diff(n) {
  return {
    bulletSpd: Math.min(140 + n * 6, 300),
    diveSpd: Math.min(150 + n * 7, 310),
    enterSpd: Math.min(190 + n * 8, 330),
    maxDivers: Math.min(2 + Math.floor(n / 2), 9),
    diveGap: Math.max(0.4, 2.6 - n * 0.11),
    formFire: n >= 2 ? Math.max(0.35, 3.4 - n * 0.13) : 0,
    entryShot: n >= 3 ? Math.min(0.6, 0.08 + n * 0.03) : 0,
    sway: 16 + Math.min(n, 20),
  };
}
const weaponCap = () => Math.max(startLevel(), Math.min(5, 1 + Math.ceil(wave / 3)));

// ---------- Paths (Catmull-Rom splines) ----------
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return {
    x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
    y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
  };
}
function makePath(pts) { return { p: [pts[0], ...pts, pts[pts.length - 1]], seg: 1, t: 0 }; }
function stepPath(path, dist) {
  const n = path.p.length - 2;
  while (dist > 0) {
    if (path.seg >= n) return null;
    const a = path.p[path.seg], b = path.p[path.seg + 1];
    const L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const dt = dist / L;
    if (path.t + dt < 1) { path.t += dt; dist = 0; }
    else { dist -= (1 - path.t) * L; path.t = 0; path.seg++; }
  }
  if (path.seg >= n) return null;
  return catmull(path.p[path.seg - 1], path.p[path.seg], path.p[path.seg + 1], path.p[path.seg + 2], path.t);
}

// Entry swoops, normalised [x, y] for the left side (mirrored for the right)
const ENTRY = [
  [[0.42, -0.06], [0.48, 0.18], [0.30, 0.42], [0.10, 0.36], [0.16, 0.20]],
  [[-0.08, 0.62], [0.25, 0.56], [0.55, 0.40], [0.42, 0.22], [0.28, 0.28]],
  [[0.08, -0.06], [0.18, 0.32], [0.50, 0.52], [0.78, 0.36], [0.62, 0.18]],
  [[-0.08, 0.15], [0.35, 0.20], [0.62, 0.45], [0.35, 0.60], [0.20, 0.40]],
  [[0.50, -0.06], [0.50, 0.25], [0.20, 0.45], [0.05, 0.25], [0.25, 0.15]],
  [[-0.08, 0.35], [0.40, 0.30], [0.70, 0.15], [0.45, 0.05], [0.30, 0.20]],
];

function slotPos(c, r) {
  const br = 1 + 0.05 * Math.sin(T * 1.7);
  const cx = W / 2 + Math.sin(T * 0.45) * D.sway;
  return { x: cx + (c - 3.5) * 34 * br, y: fTop + r * 30 * br };
}

// Formation layouts rotate, and later cycles add drones, fuller rows and tougher ships
const BOSS_ESCORT = {

  fortress:  [['inter', [0, 1, 2, 3, 4, 5, 6, 7]], ['wedge', [1, 3, 4, 6]]],

  dread:     [['wedge', [1, 3, 4, 6]], ['inter', [0, 1, 2, 3, 4, 5, 6, 7]]],
  crab:      [['raider', [0, 1, 2, 3, 4, 5, 6, 7]], ['drone', [0, 1, 6, 7]]],

  brood:     [['drone', [0, 1, 2, 3, 4, 5, 6, 7]], ['raider', [1, 2, 5, 6]]],

  twins:     [['inter', [0, 1, 2, 3, 4, 5, 6, 7]], ['raider', [0, 1, 6, 7]]],
  warden:    [['wedge', [0, 7]], ['inter', [0, 1, 2, 3, 4, 5, 6, 7]]],
  serpent:   [['bird', [0, 1, 6, 7]], ['drone', [0, 1, 2, 3, 4, 5, 6, 7]]],
};
const LAYOUTS = [
  [['wedge', [2, 3, 4, 5]], ['bird', [1, 2, 3, 4, 5, 6]], ['inter', 'A'], ['inter', 'A']],
  [['bird', [0, 1, 6, 7]], ['wedge', [1, 3, 4, 6]], ['raider', 'A'], ['inter', 'A']],
  [['wedge', [3, 4]], ['bird', [2, 3, 4, 5]], ['raider', [1, 2, 3, 4, 5, 6]], ['inter', 'A'], ['raider', [0, 2, 5, 7]]],
  [['wedge', [0, 2, 5, 7]], ['raider', 'A'], ['bird', 'A'], ['inter', [0, 1, 2, 5, 6, 7]]],
  [['bird', [0, 3, 4, 7]], ['wedge', [0, 3, 4, 7]], ['raider', [0, 1, 3, 4, 6, 7]], ['inter', [0, 1, 3, 4, 6, 7]], ['drone', [0, 7]]],
  [['wedge', [3, 4]], ['wedge', [2, 5]], ['bird', [1, 2, 5, 6]], ['raider', 'A'], ['inter', 'A']],
];
function waveRows(n) {
  const A = [0, 1, 2, 3, 4, 5, 6, 7];
  if (n % 5 === 0) return BOSS_ESCORT[BOSSES[(n / 5 - 1) % BOSSES.length]].map((e, i) => ({ r: 3 + i, t: e[0], c: e[1].slice() }));
  const cyc = Math.floor((n - 1) / 5), k = (n - 1) % 5;
  const rows = LAYOUTS[(k + cyc * 3) % LAYOUTS.length].map((e, i) => ({ r: i, t: e[0], c: e[1] === 'A' ? A.slice() : e[1].slice() }));
  if (cyc >= 1 && rows.length < 5) rows.push({ r: rows.length, t: 'drone', c: [1, 2, 5, 6] });
  if (cyc >= 2) rows.forEach(r => { if (r.t !== 'wedge') r.c = A.slice(); });
  if (cyc >= 3) { rows[0].t = 'wedge'; rows[0].c = [1, 2, 3, 4, 5, 6]; }
  return rows;
}
function enemyHp(type) {
  const cyc = Math.floor((wave - 1) / 5);
  const bonus = { wedge: cyc, bird: cyc >= 1 ? 1 : 0, raider: cyc >= 3 ? 1 : 0, inter: cyc >= 4 ? 1 : 0, drone: cyc >= 3 ? 1 : 0 }[type];
  return TYPES[type].hp + Math.min(bonus, 4);
}

function buildWave(n) {
  const cyc = Math.floor((n - 1) / 5);
  const gap = Math.max(1.1, 1.8 - n * 0.03), step = Math.max(0.11, 0.16 - n * 0.003);
  const q = [];
  waveRows(n).forEach((row, ri) => {
    const tpl = ENTRY[(ri * 2 + n + cyc * 3) % ENTRY.length];
    for (const side of ['L', 'R']) {
      const cols = row.c.filter(c => side === 'L' ? c < 4 : c >= 4);
      if (side === 'L') cols.reverse();
      cols.forEach((c, i) => {
        const pts = tpl.map(([tx, ty]) => ({ x: (side === 'L' ? tx : 1 - tx) * W, y: ty * H }));
        q.push({ at: 0.8 + ri * gap + i * step, t: row.t, c, r: row.r, pts });
      });
    }
  });
  return q.sort((a, b) => a.at - b.at);
}

function makeBoss(n) {
  const i = n / 5 - 1, kind = BOSSES[i % BOSSES.length], loop = Math.floor(i / BOSSES.length);
  const info = BOSS_INFO[kind];
  const hp = Math.round((110 + n * 12) * info.hp * (1 + loop * 0.5));
  const b = { kind, loop, x: W / 2, y: -140, ty: fTop + info.ty, hp, max: hp, flash: 0, atkT: 2.5, phase: 0, rot: 0, alpha: 1,
    inv: 0, charge: 0, queue: [], dmg: 0, tx: W / 2, tyy: 0, moveT: 0, ram: null, fade: null, entered: false, lights: [] };
  for (let k = 0; k < 18; k++) b.lights.push({ a: Math.random() * TAU, r: Math.random() });
  if (BOSS_PARTS[kind]) {   // usually 45% of the health sits in the parts, the rest in the core
    const share = PART_SHARE[kind] || 0.45, each = Math.round(hp * share / BOSS_PARTS[kind].length);
    b.parts = BOSS_PARTS[kind].map(p => Object.assign({}, p, { hp: each, max: each, dead: false, flash: 0 }));
    b.core = share >= 1 ? 0 : hp - each * b.parts.length;
    b.hp = b.max = b.core + each * b.parts.length;
  }
  if (kind === 'serpent') { b.trail = []; for (let k = 0; k < 46; k++) b.trail.push({ x: W / 2, y: b.ty - k * 4 }); }
  return b;
}

function startWave(n) {
  wave = n; D = diff(n);
  spawnQ = buildWave(n); spawnClock = 0; enemies = []; ebullets = []; hazards = []; boss = null;
  mites = []; trails = []; holes = [];
  diveT = 3.5; formFireT = 4; nextWaveT = 0; bannerT = 2.6; sectorCard = null;
  if ((n - 1) % 5 === 0) sector = { no: Math.ceil(n / 5), targets: 0, destroyed: 0, pods: 0, rescued: 0, damage: 0 };
  outpostT = n % 5 ? 2.5 : null;
  podT = n % 5 ? rand(5, 12) : null;
  saveProgress(); if (!practice) saveRun();
  if (n % 5 === 0) {
    boss = makeBoss(n);
    const info = BOSS_INFO[boss.kind];
    bannerText = 'WARNING: ' + info.name + (boss.loop ? ' Mk' + (boss.loop + 1) : '');
    bannerSub = info.tag;
    sfx.alarm();
  } else { bannerText = 'WAVE ' + n; bannerSub = n > 1 ? 'GET READY' : ''; sfx.wave(); }
}

function resetRun() {
  score = 0; lives = 3; newHi = false; nextLife = 30000;
  bullets = []; ebullets = []; particles = []; powerups = []; popups = []; hazards = [];
  gems = []; outposts = []; pods = []; runStars = 0; practice = null;
  state = 'play'; paused = false; T = 0;
}
// Boss practice: fight any boss straight away from the title screen (doesn't touch your saved game)
function startPractice(kind) {
  resetRun(); practice = kind;
  const n = (BOSSES.indexOf(kind) + 1) * 5;
  Object.assign(player, { x: W / 2, y: playerY(), alive: true, inv: 2.5, shield: U('shield') >= 1, shieldT: 25, cool: 0.5,
    level: Math.max(startLevel(), Math.min(5, 1 + Math.ceil(n / 3))), lance: 0, homing: 0, bombs: Math.max(1, U('bomb')), hp: maxHull() });
  startWave(n);
}
function newGame(sec = 1) {
  resetRun();
  const n = (sec - 1) * 5 + 1;
  Object.assign(player, { x: W / 2, y: playerY(), alive: true, inv: 2.5, shield: U('shield') >= 1, shieldT: 25, cool: 0.5,
    level: Math.max(startLevel(), Math.min(5, Math.ceil(n / 3))), lance: 0, homing: 0, bombs: U('bomb'), hp: maxHull() });
  startWave(n);
}

// ---------- Saved game: a checkpoint is written at the start of every wave ----------
function savedRun() {
  try { const s = JSON.parse(load('ns_run', '') || 'null'); return s && s.wave ? s : null; } catch (e) { return null; }
}
function saveRun() {
  store('ns_run', JSON.stringify({ wave, score, lives, nextLife, runStars, sector, level: player.level, bombs: player.bombs, shield: player.shield }));
}
function clearRun() { try { localStorage.removeItem('ns_run'); } catch (e) {} }
function continueGame() {
  const s = savedRun();
  if (!s) { newGame(startSector); return; }
  resetRun();
  score = s.score; lives = s.lives; nextLife = s.nextLife; runStars = s.runStars; sector = s.sector;
  Object.assign(player, { x: W / 2, y: playerY(), alive: true, inv: 2.5, shield: s.shield || U('shield') >= 1, shieldT: 25, cool: 0.5,
    level: Math.max(startLevel(), s.level), lance: 0, homing: 0, bombs: Math.min(s.bombs, maxBombs()), hp: maxHull() });
  startWave(s.wave);
}

// ---------- Effects ----------
function explode(x, y, colors, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU, v = rand(0.2, 1) * speed;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.35, 0.9), max: 0.9, c: colors[(Math.random() * colors.length) | 0], s: rand(1.2, 3) });
  }
  particles.push({ ring: true, x, y, life: 0.35, max: 0.35, r: speed * 0.12 });
}
function shake(t, m) { shakeT = Math.max(shakeT, t); shakeMag = Math.max(shakeMag, m); }
function popup(x, y, txt, col = '#7fe0ff') { popups.push({ x, y, txt, life: 1, col }); }
function addScore(v, x, y) {
  score += v;
  if (v >= 150) popup(x, y, String(v));
  if (score >= nextLife) { nextLife += 30000; lives = Math.min(lives + 1, 6); popup(W / 2, H * 0.6, 'EXTRA SHIP!', '#7dff8a'); sfx.power(); }
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  const tp = TYPES[e.type];
  const diving = e.state === 'dive';
  addScore(diving ? tp.dive : tp.score, e.x, e.y);
  explode(e.x, e.y, tp.colors, e.type === 'wedge' ? 40 : 24, e.type === 'wedge' ? 170 : 130);
  sfx.boom(); if (e.type === 'wedge') shake(0.2, 4);
  if (Math.random() < (diving ? 0.13 : 0.06)) dropPower(e.x, e.y);
  dropGems(e.x, e.y, { inter: 1, raider: 1, bird: 2, wedge: 3, drone: 1 }[e.type] + (diving ? 1 : 0));
}

// ---------- Stars: the currency for the hangar ----------
function dropGems(x, y, n, val = 1) {
  for (let i = 0; i < n; i++) {
    const a = rand(-Math.PI, 0), v = rand(30, 100);
    gems.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, val, spin: rand(0, TAU) });
  }
}
function updateGems(dt) {
  const R = magnetR();
  for (const g of gems) {
    const dx = player.x - g.x, dy = player.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (player.alive && (g.pull || d < R)) {
      g.pull = true;
      const k = Math.min(1, dt * 8);
      g.vx = lerp(g.vx, dx / d * 420, k); g.vy = lerp(g.vy, dy / d * 420, k);
    } else { g.vx *= 0.96; g.vy = lerp(g.vy, 55, Math.min(1, dt * 1.5)); }
    g.x += g.vx * dt; g.y += g.vy * dt; g.spin += dt * 3;
    if (player.alive && d < 16) {
      g.dead = true; runStars += g.val; bank += g.val;
      if (clock - lastCoin > 0.06) { sfx.coin(); lastCoin = clock; }
    }
  }
  gems = gems.filter(g => !g.dead && g.y < H + 20);
}
function drawStarShape(x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath();
}
function drawStarIcon(x, y, r) {
  drawStarShape(x, y, r); ctx.fillStyle = '#ffd34a'; ctx.fill(); ctx.strokeStyle = '#a8700a'; ctx.lineWidth = 0.8; ctx.stroke();
}

// P weapon up · S shield · R hull repair · L lance · H homing missiles · B bomb (rare) · + extra ship
const POWER_COL = { P: '#ffb04a', S: '#5ad2ff', R: '#b6ff5a', L: '#7fe0ff', H: '#ffe066', B: '#ff4a6a', '+': '#7dff8a' };
function dropPower(x, y, forced) {
  let k = forced;
  if (!k) {
    const pool = [['P', 40], ['S', 18], ['R', 14], ['+', 4], ['B', 5]];
    if (wave >= 6) pool.push(['L', 12]);
    if (wave >= 9) pool.push(['H', 12]);
    let r = Math.random() * pool.reduce((s, p) => s + p[1], 0);
    for (const [kk, w] of pool) { r -= w; if (r <= 0) { k = kk; break; } }
  }
  powerups.push({ x, y, k, vy: 60 });
}
function collectPower(p) {
  sfx.power();
  if (p.k === 'P') {
    if (player.level < weaponCap()) { player.level++; popup(p.x, p.y, LEVEL_NAMES[player.level], '#ffb04a'); sfx.levelup(); }
    else { addScore(500, p.x, p.y); popup(p.x, p.y - 14, player.level >= 5 ? 'MAX POWER' : 'NEXT UPGRADE WAVE ' + (player.level * 3 - 2), '#ffb04a'); }
  }
  else if (p.k === 'S') { player.shield = true; popup(p.x, p.y, 'SHIELD'); }
  else if (p.k === 'R') { player.hp = Math.min(maxHull(), player.hp + 2); popup(p.x, p.y, 'HULL REPAIRED', '#b6ff5a'); }
  else if (p.k === 'L') { player.lance = 8 * powerMul(); popup(p.x, p.y, 'LANCE BEAM'); }
  else if (p.k === 'H') { player.homing = 12 * powerMul(); popup(p.x, p.y, 'SEEKER MISSILES', '#ffe066'); }
  else if (p.k === 'B') { player.bombs = Math.min(player.bombs + 1, maxBombs()); popup(p.x, p.y, 'NOVA BOMB!', '#ff4a6a'); }
  else { lives = Math.min(lives + 1, 6); popup(p.x, p.y, '1UP', '#7dff8a'); }
}

function useBomb() {
  if (!player.alive || player.bombs <= 0 || state !== 'play' || paused) return;
  player.bombs--;
  sfx.bomb(); shake(0.8, 10); flashT = 0.35;
  bombRing = { x: player.x, y: player.y, t: 0 };
  for (const b of ebullets) explode(b.x, b.y, ['#fff', '#ffb0c0'], 2, 40);
  ebullets = []; hazards = [];
  for (const e of enemies) if (e.y > -20) { e.hp -= 6; e.flash = 0.1; if (e.hp <= 0) killEnemy(e); }
  for (const o of outposts) if (o.y > -20) for (const t of o.targets) if (!t.dead) hitTarget(o, t, 6);
  for (const m of mites) if (m.y > -10 && m.x > -10 && m.x < W + 10) killMite(m);
  holes = []; trails = [];
  if (boss) { boss.inv = 0; boss.tractor = null; if (boss.fade) { boss.fade = null; boss.alpha = 1; } damageBoss(boss.max * 0.12, boss.x, boss.y, true); }
}

function hitPlayer(dmg = 1) {
  if (!player.alive || player.inv > 0) return;
  if (player.shield) {
    player.shield = false; player.inv = 1.2; player.shieldT = 25; sfx.shield();
    explode(player.x, player.y, ['#9ff', '#5ad2ff', '#fff'], 20, 120);
    return;
  }
  sector.damage++;
  player.hp -= dmg;
  if (player.hp > 0) {   // armour soaks the hit
    player.inv = 1.2; sfx.hurt(); shake(0.3, 5);
    explode(player.x, player.y, ['#fff', '#ffd27a', '#ff7a3a'], 16, 120);
    return;
  }
  player.alive = false; lives--;
  player.level = Math.max(startLevel(), player.level - 1); player.lance = 0; player.homing = 0;
  explode(player.x, player.y, ['#fff', '#ffd27a', '#ff7a3a', '#9ad7ff', '#c8ccd2'], 70, 230);
  shake(0.6, 9); sfx.die();
  if (lives > 0) respawnT = 2; else gameOverDelay = 2.4;
}

function enemyShoot(x, y, aimed, spd, col, r, spread = 0) {
  if (ebullets.length > 90) return;
  let a = Math.PI / 2;
  if (aimed) {
    const dx = player.x - x, dy = player.y - y;
    if (dy < 30) return;
    a = Math.atan2(dy, dx);
  }
  a += spread;
  ebullets.push({ x, y: y + 6, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, col, r });
}
function fan(x, y, n, center, width, spd, col, r) {
  for (let i = 0; i < n; i++) {
    const a = center + (n === 1 ? 0 : (i / (n - 1) - 0.5) * width);
    ebullets.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, col, r });
  }
}
const aimAt = (x, y) => Math.atan2(player.y - y, player.x - x);

function launchDive(e, lead) {
  let pts;
  if (lead) {
    pts = [{ x: e.x, y: e.y }, ...lead.pts.slice(1).map(p => ({ x: p.x + lead.dx, y: p.y }))];
  } else {
    const dir = e.x < W / 2 ? -1 : 1;
    const px = clamp(player.x, 30, W - 30), py = clamp(player.y, H * 0.5, H - 40);
    pts = [{ x: e.x, y: e.y }, { x: e.x + dir * 22, y: e.y - 24 }, { x: e.x + dir * 46, y: e.y + 6 }];
    if (wave >= 6 && Math.random() < 0.35) {          // loop-the-loop dive
      const cx = clamp(lerp(e.x, px, 0.5), 70, W - 70), cy = H * 0.42;
      pts.push({ x: cx, y: cy - 40 }, { x: cx + dir * 45, y: cy }, { x: cx, y: cy + 40 }, { x: cx - dir * 45, y: cy }, { x: cx, y: cy - 30 });

function spawnMinion(type, x, y) {

  diveT -= dt;
  if (diveT > 0) return;
  const inForm = enemies.filter(e => e.state === 'form');
  const diving = enemies.filter(e => e.state === 'dive').length;
  diveT = (enemies.length <= 5 ? 0.6 : D.diveGap) * rand(0.6, 1.3);
  if (!inForm.length || diving >= D.maxDivers) return;
  const e = pick(inForm);

    for (const o of inForm) {
      if (n >= 2) break;

function beam(b, fx, fy, ang, opts) {

const BOSS_MOVE = {

// ---------- Legion mechanics ----------
// Pull the ship without fighting the finger: shift the drag anchor by the same amount
function nudgePlayer(dx, dy) {
  const nx = clamp(player.x + dx, 20, W - 20), ny = clamp(player.y + dy, minPlayerY(), maxPlayerY());
  if (drag) { drag.px += nx - player.x; drag.py += ny - player.y; }

    { x: clamp(player.x, 40, W - 40), y: clamp(player.y - 50, H * 0.4, H * 0.8) }, { x: W / 2 + s * W * 0.35, y: H * 0.66 }, { x: fromLeft ? W + 30 : -30, y: H * 0.45 }];

}
function killMite(m) {

function openHole() {

function updateLegion(dt) {
  for (const t of trails) t.t += dt;
  trails = trails.filter(t => t.t < 1.9);
  for (const m of mites) {
    const p = stepPath(m.path, 250 * dt);
    if (!p) { m.dead = true; continue; }
    m.rot = Math.atan2(p.y - m.y, p.x - m.x); m.x = p.x; m.y = p.y;
    if (player.alive && player.inv <= 0 && Math.hypot(m.x - player.x, m.y - player.y) < 14) { killMite(m); hitPlayer(); }
  }
  mites = mites.filter(m => !m.dead);
  for (const h of holes) {
    h.t += dt;
    if (h.t < h.warn) continue;
    const act = h.t - h.warn;
    if (act > h.life) { h.dead = true; continue; }
    const k = Math.min(1, act * 2) * (act > h.life - 0.5 ? (h.life - act) / 0.5 : 1);
    const dx = h.x - player.x, dy = h.y - player.y, d = Math.hypot(dx, dy) || 1;

        if (p.dead) return;
